// Special thanks to Vali for figuring out this issue! :)
// The Vintage, Standard, and Future suits are all defined in separate part modules that are combined when KSP starts.
// The problem is that when Module Manager is used to add part modules to the kerbal, you'll get duplicates.
// To get around that problem, WBIModuleKerbalEVAModules adds the controller to each EVA prefab and registers the other MODULE nodes
// for dynamic creation when a carried KerbalGear item requests them.
// This is the baseline file. Other mods can define additional KERBAL_EVA_MODULES nodes. The optional kerbalGearMode value accepts
// Exclusive (the default), Aggregate, or PerProvider.
KERBAL_EVA_MODULES
{
	// This is a helper module that hides and shows custom 3D meshes on a kerbal whenever cargo parts are placed in or removed from
	// the kerbal's inventory.
	MODULE
	{
		name = WBIModuleWearablesController

		// When set to true, the kerbal's PAW gains a button to open the prop offsets window.
		// The window lets you position and rotate a cargo part's custom 3D mesh and see the updates in realtime
		// without the need to restart KSP.
		// Once you have the offsets, you can copy them to the clipboard and paste them into your part.
		debugMode = false
	}

	// Overrides the kerbal's EVA parameters as specified by the carried cargo part's EVA_OVERRIDES node.
	// WBIModuleEVADiveComputer does the same thing, but this module lacks all the diving functionality.
	MODULE
	{
		name = WBIModuleEVAOverrides

		// One controller combines the strongest overrides from all contributing cargo.
		kerbalGearMode = Aggregate
	}

	// Transfers resources between inventory parts
	MODULE
	{
		name = WBIModuleEVAResourceTransfer

		// One bridge exposes resources from every contributing inventory item.
		kerbalGearMode = Aggregate
	}

	// Makes the fuel pump available to carried KerbalGear items that explicitly request it.
	// Multiple requesting items share one pump instance on the EVA vessel.
	MODULE
	{
		name = WBIModuleFuelPump
		kerbalGearMode = Aggregate
	}

	// Uses a carried resource to remove heat from an EVA kerbal's skin. This reproduces
	// ModuleAblator's loss-rate and pyrolysis cooling without heat-shield geometry assumptions.
	MODULE
	{
		name = WBIModuleEVAAblator
		kerbalGearMode = Aggregate

		ablativeResource = Ablator
		lossExp = -7500
		lossConst = 0.1
		pyrolysisLossFactor = 6000
		ablationTempThresh = 500
	}

	// Provides stock engine behavior to an electric KerbalGear propeller. Each carried motor gets
	// its own module instance so ignition, reverse thrust, and rotor state remain item-specific.
	MODULE
	{
		name = WBIModuleEVAMotor
		kerbalGearMode = PerProvider
	}
}
