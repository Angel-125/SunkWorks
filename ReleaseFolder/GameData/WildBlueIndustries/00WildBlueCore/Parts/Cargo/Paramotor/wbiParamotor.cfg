PART
{
	name = wbiParamotor
	module = Part
	author = Angel-125
	MODEL
	{
		model = WildBlueIndustries/00WildBlueCore/Parts/Cargo/Paramotor/paramotor
	}	
	rescaleFactor = 1
	TechRequired = start	
	entryCost = 0
	cost = 650
	category = Cargo
	subcategory = 0
	title = #LOC_WILDBLUECORE_Paramotor_Title // EPG-5 Paramotor
	manufacturer = #autoLOC_501639 //#autoLOC_501639 = Reaction Systems Ltd
	description = #LOC_WILDBLUECORE_Paramotor_Desc // Parachutes enable kerbals to slowly hurtle themselves towards the ground. The EPG-5 Paramotor lets them miss. Be sure to carry extra batteries like the Z-100 for extended flight times.

	attachRules = 0,0,0,0,0
	mass = 0.023
	dragModelType = default
	maximum_drag = 0.1
	minimum_drag = 0.1
	angularDrag = 2
	crashTolerance = 12
	maxTemp = 2000 // = 2000
	resourcePriorityOffset = 2
	tags = #autoLOC_8003422 //#autoLOC_8003422 = pack thrust MMU RCS Kerbal control cargo EVA
	
	MODULE
	{
		name = ModuleCargoPart
		packedVolume = 25
		reinitResourcesOnStoreInVessel = true
	}	

	// This module represents an item that appears as a 3D model on the kerbal as well as a list of part modules
	// associated with the item. EVA_PART_MODULE requests use the defaults registered in
	// KERBAL_EVA_MODULES and can override their runtime fields for this wearable.
	// You can have more than one WBIModuleWearableItem part module per cargo part.
	MODULE
	{
		name = WBIModuleWearableItem

		// ID of the module. This should be unique within the part.
		moduleID = EPG5Paramotor

		// Where to place the item, such as on the back of the kerbal, the end of the backpack. etc.
		// back: The back of the kerbal.
		// backOrJetpack: The back of the kerbal, or the back of the jetpack if the kerbal is carrying a jetpack.
		// leftFoot: The left foot of the kerbal.
		// rightFoot: The right foot of the kerbal.
		bodyLocation = back

		// Name of the high-level anchor transform. This will follow the bodyLocation bone as it moves.
		anchorTransform = paramotor

		// Name of the 3D model. This will be rotated and positioned relative to the anchorTransform.
		meshTransform = paramotorProps

		// Position offset of the meshTransform
		positionOffset = 0.0000, 0.0000, 0.0800

		// Position offset of the meshTransform when the kerbal has a jetpack.
		// Requires equipLocation = backOrJetpack
		positionOffsetJetpack = 0,0,0

		// Rotation offset of the meshTransform
		rotationOffset = -90.0000, 0.0000, 0.0000

		// Show parachute if equipped.
		showChuteTransforms = true

		// Make the paramotor's ElectricCharge available to EVA modules.
		EVA_PART_MODULE
		{
			name = WBIModuleEVAResourceTransfer
		}

		// Add and configure the motor while this paramotor is carried.
		EVA_PART_MODULE
		{
			name = WBIModuleEVAMotor

			// Empty either environment resource name to disable that operating environment. These are
			// virtual working fluids; the module uses their resource definitions but does not add tanks.
			atmosphericResourceName = IntakeAir
			aquaticResourceName = IntakeLqd

			// At full throttle, 0.0666667 EC/sec consumes 100 EC in 1,500 seconds (25 minutes).
			// Consumption scales with throttle.
			propellantResourceName = ElectricCharge
			propellantResourceRate = 0.0666667

			// Stock ModuleEngines configuration. The flat curve keeps the rated 1 kN thrust in
			// standard Kerbin atmosphere as well as underwater.
			maxThrust = 1
			minThrust = 0
			heatProduction = 0
			EngineType = Electric
			allowShutdown = true
			allowRestart = true
			stagingEnabled = false
			overrideStagingIconIfBlank = false
			exhaustDamage = false
			useEngineResponseTime = false
			atmosphereCurve
			{
				key = 0 100
				key = 1 100
			}

			// Scale atmospheric mass flow and thrust with static pressure in atmospheres.
			// Aquatic operation remains at full flow and does not use this curve.
			atmosphericFlowCurve
			{
				key = 0 0
				key = 0.01 0.05
				key = 0.0667 0.20 // Approximate Duna sea-level pressure
				key = 1 1
			}
			flameoutBar = 0.001

			// Wearable model transforms and rotor behavior.
			forwardThrustTransformName = thrustTransform
			reverseThrustTransformName = reverseThrustTransform
			canReverseThrust = true
			rotorTransformName = PropellerBlades
			rotorRotationAxis = 0,0,-1
			rotorRPM = 30
			rotorSpoolTime = 3
			blurredRotorFactor = 4
			minThrustRotorBlur = 25
			blurredRotorName = PropellerBladesBlurred
			blurredRotorRPM = 30
			restoreToNeutralRotation = true
			neutralSpinRate = 10

			// Looping motor sound. The URL omits the audio file extension.
			runningSound = WildBlueIndustries/00WildBlueCore/Sounds/paramotorRunning
			runningSoundVolume = 3
			runningSoundPitchMin = 0.7
			runningSoundPitchMax = 1.4
		}
	}

	RESOURCE
	{
		name = ElectricCharge
		amount = 10
		maxAmount = 10
		isTweakable = False
	}
}
