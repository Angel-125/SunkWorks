	manufacturer = #autoLOC_501624 //#autoLOC_501624 = C7 Aerospace Division
	description = #LOC_WILDBLUECORE_Mk18_Chute_Desc // Unlike previous parachute models, the Mk18 trades the traditional circular chute design for a rectangular design with front pockets. While incapable of storing keys and smartphones, the front pockets trap air and turn the chute into a wing capable of generating lift.
	attachRules = 1,1,1,1,1
	mass = 0.125
	dragModelType = default
	angularDrag = 3
	crashTolerance = 12
	maxTemp = 2500
	emissiveConstant = 0.7
	stageOffset = -1
	preferredStage = PARACHUTESTAGE
	bulkheadProfiles = size0, srf
	bodyLiftMultiplier = 0
	breakingForce = 50000
	breakingTorque = 50000
