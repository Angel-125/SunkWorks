	MODULE
	{
		name = ModuleControlSurface
		useInternalDragModel = True
		dragCoeff = 0.20
		deflectionLiftCoeff = 1.25
		ctrlSurfaceRange = 20
		ctrlSurfaceArea = 2.0
		actuatorSpeed = 25
		transformName = ControlSurface
	}

	MODULE
	{
		name = ModuleLiftingSurface
		useInternalDragModel = True
		deflectionLiftCoeff = 28 // 141.57 m^2 area actually corresponds to a value of 42.9. By contrast the Big-S Delta Wing has a value of 5 and 16.5 m^2
		dragAtMinAoA = 0.01
		dragAtMaxAoA = 0.10
		ignoresShielding = False
	}

	// Real parafoils have side stabilizer panels that provide several benefits:
	// Resist sideslip.
	// Provide passive yaw stability.
	// Help the canopy point into the relative wind.
	// Dampen yaw and roll oscillations.
	// Reduce spanwise airflow and tip-vortex losses.
	// Help keep the end cells pressurized and reduce tip collapse.
	// Improve heading stability during turns and recovery afterward.
	MODULE
	{
		name = ModuleParafoilStabilizer
		transformName = LeftStabilizer
		deflectionLiftCoeff = 0.15
		useInternalDragModel = True
		dragAtMinAoA = 0.01
		dragAtMaxAoA = 0.10
	}

	MODULE
	{
		name = ModuleParafoilStabilizer
		transformName = RightStabilizer
		deflectionLiftCoeff = 0.15
		useInternalDragModel = True
		dragAtMinAoA = 0.01
		dragAtMaxAoA = 0.10
	}

	MODULE
	{
		name = ModuleParafoil

		// ModuleParachute parameters
		invertCanopy = true
		autoCutSpeed = 5
		capName = cap
		canopyName = canopy
		semiDeployedAnimation = semiDeploy
		fullyDeployedAnimation = fullyDeploy
		stowedDrag = 0.22
		semiDeployedDrag = 1
		fullyDeployedDrag = 0 // 170
		minAirPressureToOpen = 0.02
		clampMinAirPressure = 0.02
		deployAltitude = 4500
		deploymentSpeed = 0.16667
		semiDeploymentSpeed = 0.5
		chuteMaxTemp = 1600
		machHeatMultBase = 0.25
		chuteThermalMassPerArea = 0.09

		// Parafoil parameters
		debugMode = false
		debugLogInterval = 0.25
		diagnosticsOnly = false

		// How many seconds to ramp up control authority
		controlAuthorityRampTime = 1

		// Flag to enable flight control when the chute is in the semi-deployed state.
		// This is off by default.
		enableControlInSemiDeploy = false

		// ModuleLiftingSurface parameters
		// Lift coefficient when the chute is semi-deployed (not fully open)
		// Requires enableControlInSemiDeploy = true
		semiDeployedDeflectionLiftCoeff = 0

		// ModuleControlSurface parameters
		// Control surface lift coefficient when the chute is semi-deployed (not fully open)
		// Requires enableControlInSemiDeploy = true
		semiDeployedCtlSfcDeflectionLiftCoeff = 0
	}

