PART
{
	name = wbiSupercavitator
	module = Part
	author = Angel-125
	MODEL
	{
		model = WildBlueIndustries/SunkWorks/Parts/Aero/Supercavitator/supercavitator
	}

	rescaleFactor = 1

	node_stack_bottom = 0.0, -0.376, 0.0, 0.0, -1.0, 0.0, 0
	node_attach = 0.0, -0.376, 0.0, 0.0, -1.0, 0.0, 0

	TechRequired = supersonicFlight
	entryCost = 7800
	cost = 800
	category = Structural
	subcategory = 0
	title = #LOC_SUNKWORKS_SupercavitatorTitle // SCAV-3 Supercavitator
	manufacturer = #LOC_SUNKWORKS_companyName // Sunk Works Maritime Technologies
	description = #LOC_SUNKWORKS_SupercavitatorDesc // By generating a large gas pocket, submarines can fly underwater at inappropriate speeds.
	attachRules = 1,1,1,1,0
	mass = 0.1
	dragModelType = default
	maximum_drag = 0.25
	minimum_drag = 0.25
	angularDrag = 0.5
	crashTolerance = 10
	maxTemp = 2000
	breakingForce = 50000
	breakingTorque = 50000
	bulkheadProfiles = size0, srf
	tags = SunkWorks boat submarine cavity cavitator cck-SunkWorks

	MODULE
	{
		name = WBISupercavitator

		// Proof-of-concept diagnostics written to KSP.log
		debugMode = false
		verboseDebug = false
		debugLogInterval = 1

		// Optional model transform positioned at the cavitator.
		// Its local +Z axis must point forward, toward the vehicle’s nose.
		// If omitted or not found, the part transform is used.
		cavityTransformName = cavitatorTransform

		// Cavity activation speeds, m/s
		minimumCavitySpeed = 20
		fullCavitySpeed = 40

		// Cavity dimensions. Full length is maximumCavityRadius multiplied by
		// cavityLengthRadiusMultiplier (2.5 m * 10 = 25 m by default).
		cavityLengthRadiusMultiplier = 10
		cavitatorRadius = 0.25

		// Begin at the cavitator disk. The cavity object's local origin remains exactly
		// at cavitatorTransform, while the nonzero radius makes that origin visible.
		cavityTipRadius = 0.25
		maximumCavityRadius = 3

		// Rounded nose length as a fraction of total cavity length.
		// 0.125 gives a 3.125 m nose at the configured 25 m cavity length,
		// slightly longer than a 2.5 m maximum radius.
		cavityExpansionFraction = 0.125

		// Constant-radius body length measured in maximum cavity radii.
		// 2 radii gives a 5 m straight section at maximum strength.
		cavityStraightRadiusMultiplier = 2

		// 0 = follow cavitator transform
		// 1 = follow water-relative velocity
		velocityAlignment = 0.75

		// Angle-of-attack limits, degrees
		fullStrengthAngle = 5
		collapseAngle = 20

		// Cavitator submersion needed for full cavity strength
		fullStrengthSubmergedPortion = 0.5

		// Fraction of stock water drag retained by a fully covered part
		residualWaterDrag = 0.05

		// Resource consumption

		// % of resource rate needed to form the supercavity
		// Ex: 1.0 = 100% of the consumption rate will be needed until the supercavity is fully formed.
		formationGasRate = 1.0

		// % of resource rate needed to sustain the supercavity
		sustainGasRate = 0.15

		// % of resource rate increase per atmosphere (10 m) to sustain the supercavity. Might vary per celestial body.
		depthGasMultiplier = 0.02

		// % of resource rate increase to sustain the supercavity while maneuvering
		maneuverGasMultiplier = 2.0

		INPUT_RESOURCE
		{
			ResourceName = MonoPropellant
			Ratio = 0.5
			FlowMode = STAGE_PRIORITY_FLOW
		}
	}

	MODULE
	{
		name = WBISupercavitatorFX

		// EFFECTS group driven from 0 (no cavity) to 1 (full cavity).
		runningEffect = running

		// Displays the live cavity in flight and a full-strength preview in the VAB/SPH.
		showCavity = true
		cavityOpacity = 0.25
		cavityColor = 0.15, 0.65, 1.0
		lengthSegments = 32
		radialSegments = 24
		diagnosticRingWidth = 0.04

		// Sea Foam Animation
		foamRepeatLength = 3
		foamFlowSpeed = 18
		foamMinimumFlowSpeed = 8
		foamMaximumVesselSpeedMultiplier = 2.5
		foamColor = 0.8, 0.95, 1.0
		foamOpacity = 0.35
	}

	EFFECTS
	{
		running
		{
			MODEL_MULTI_PARTICLE
			{
				name = FullThrust1
				modelName = WildBlueIndustries/SunkWorks/FX/PumpjetExhaustFull1
				transformName = effectsTransform
				emission = 0.0 0.0
				emission = 0.25 0.1
				emission = 0.5 1
				emission = 5.0 5.0
				speed = 0.0 0.0
				speed = 0.25 0.0
				speed = 0.5 0.5
				localScale = 4, 4, 4 
			}
			MODEL_MULTI_PARTICLE
			{
				name = FullThrust2
				modelName = WildBlueIndustries/SunkWorks/FX/PumpjetExhaustFull2
				transformName = effectsTransform
				emission = 0.0 0.0
				emission = 0.25 0.0
				emission = 0.5 1
				emission = 5.0 5.0
				speed = 0.0 0.0
				speed = 0.5 0.5
				localScale = 4, 4, 4 
			}
		}
	}
}
