PART
{
	name = wbiProceduralBoatHull
	module = Part
	author = Angel-125

	MODEL
	{
		model = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/proceduralBoatHull
	}
	rescaleFactor = 1

	node_stack_deck = 0, 0, 0, 0, 0, -1, 2
	node_attach = 0, 0, 0, 0, 0, -1, 2
	attachRules = 1,1,1,1,1

	TechRequired = specializedConstruction
	entryCost = 12000
	cost = 1000
	category = Structural
	subcategory = 0
	title = #LOC_SUNKWORKS_ProceduralHullTitle // SW-PH1 Boat Hull
	manufacturer = #LOC_SUNKWORKS_companyName // SunkWorks Maritime Technologies
	description = #LOC_SUNKWORKS_ProceduralHullDesc // A versatile flat-bottomed hull for building boats of nearly every sensible shape- and several thoroughly questionable ones. Features rounded chines, separate hull and antifouling finishes, and an aft run designed to keep propellers from chewing on the seabed.

	mass = 0.1
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 80
	breakingForce = 200000
	breakingTorque = 200000
	maxTemp = 1200
	bulkheadProfiles = size2, srf
	tags = cck-SunkWorks boat hull procedural

	MODULE
	{
		name = WBIModuleProceduralHull
		debugMode = true

		upperHullTransform = proceduralUpperHull
		lowerHullTransform = proceduralLowerHull
		deckTransform = proceduralDeck
		railingsTransform = proceduralRailings
		colliderHolderTransform = colliderHolder
		referenceColliderTransform = referenceCollider
		deckAnchorTransform = nodeDeckCenter

		// X is beam, Y is bow-to-stern, and +Z points down from the deck.
		// Negative X/Y rotates the generated hull 180 degrees around model Z.
		widthAxis = -1, 0, 0
		lengthAxis = 0, -1, 0
		downAxis = 0, 0, 1

		// Longitudinal (bow-to-stern) texture density in source-image pixels per meter. The runtime texture width converts this value into horizontal UV repeats. Applies to every generated material.
		textureDensityU = 64

		// Transverse, vertical, or surface-direction texture density in source-image pixels per meter. The runtime texture height converts this value into vertical UV repeats. Applies to every generated material.
		textureDensityV = 128

		// Overall bow-to-stern length in meters. PAW range: 4.0 to 60.0; step: 0.1.
		hullLength = 16

		// Maximum hull width at the paint boundary in meters. PAW range: 2.0 to 24.0; step: 0.1.
		beam = 3.7

		// Vertical distance from the deck to the main flat bottom in meters. PAW range: 0.75 to 8.0; step: 0.1.
		hullDepth = 1.8

		// Radius of the quarter-circle transition between the flat bottom and lower side. PAW range: 0.05 to 3.0; step: 0.1; also limited by beam. Chine radius and lower side height are proportionally scaled when their combined height exceeds one third of hull depth.
		chineRadius = 0.5

		// Vertical lower side above the chine and below the paint boundary, in meters. PAW range: 0.0 to 3.0; step: 0.1. Chine radius and lower side height are proportionally scaled when their combined height exceeds one third of hull depth.
		lowerSideHeight = 0.45

		// Outward angle of the upper hull sides from vertical, in degrees. PAW range: 0.0 to 30.0; step: 0.1.
		sideFlare = 10

		// Distance over which the hull widens aft from the bow, in meters. PAW range: 0.5 to 15.0; step: 0.1; no more than 75% of hull length.
		bowLength = 7.5

		// Controls how quickly the bow reaches full beam: 0 is fine and 1 is full. PAW range: 0.0 to 1.0; step: 0.1.
		bowFullness = 1

		// Fore-and-aft offset between the bow at deck and bottom, in meters. PAW range: 0.0 to 3.0; step: 0.1; no more than 80% of bow length.
		bowRake = 3

		// Distance over which the hull narrows toward the transom, in meters. PAW range: 0.0 to 15.0; step: 0.1; no more than 60% of hull length.
		sternTaperLength = 5.3

		// Transom beam divided by maximum beam: 0.25 is narrow and 1.0 is full width. PAW range: 0.25 to 1.0; step: 0.1.
		sternBeamRatio = 0.7

		// Controls how late the stern begins narrowing: 0 is fine and 1 is full. PAW range: 0.0 to 1.0; step: 0.1.
		sternFullness = 1

		// Length of the rising bottom run ahead of the stern, in meters. PAW range: 0.0 to 15.0; step: 0.1; no more than 60% of hull length.
		aftRunLength = 3

		// Amount the flat bottom rises at the stern, in meters. PAW range: 0.0 to 4.0; step: 0.1; constrained to remain below the paint boundary.
		aftRise = 1

		// Generates railings around the deck perimeter with inexpensive box safety colliders. PAW values: On or Off.
		railingsEnabled = true

		// Height of the railings above the deck, in meters. PAW range: 0.1 to 1.0; step: 0.1.
		railingHeight = 0.3

		// Inward inset and wall thickness of the solid railing, in meters. Its outer face remains on the deck edge. PAW range: 0.02 to 0.2; step: 0.01.
		railingThickness = 0.1

		// Enables the paired railing sections around the tapered bow. PAW values: On or Off.
		bowRailings = true

		// Enables the railing section across the transom. PAW values: On or Off.
		sternRailings = true

		// Enables the port-side railing aft of the bow section. PAW values: On or Off.
		portRailings = true

		// Enables the starboard-side railing aft of the bow section. PAW values: On or Off.
		starboardRailings = true

		longitudinalSections = 24
		colliderSections = 6

		// Cross-section segments used to round each chine. Visible in the PAW only when debugMode is true.
		chineSegments = 5

		massPerSquareMeter = 0.125
		costPerSquareMeter = 50
	}

	MODULE
	{
		name = WBIModulePartSubvariants
		moduleID = deckTexture
		updateSymmetry = true
		allowFieldUpdate = false

		VARIANT
		{
			name = woodenDeck
			displayName = #LOC_SUNKWORKS_woodenDeck // Wooden Decking
			primaryColor = #caa472
			secondaryColor = #caa472

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/deckMaterial
				bumpMapURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/deckMaterialBump		
				transformName = proceduralDeck
			}
		}

		VARIANT
		{
			name = metalDeck
			displayName = #LOC_SUNKWORKS_metalDeck // Metal Decking (Light)
			primaryColor = #bfbdbd
			secondaryColor = #bfbdbd

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/deckMaterialMetalLight
				bumpMapURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/deckMaterialMetalBump		
				transformName = proceduralDeck
			}
		}

		VARIANT
		{
			name = metalDeck
			displayName = #LOC_SUNKWORKS_metalDeckDark // Metal Decking (Dark)
			primaryColor = #303030
			secondaryColor = #303030

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/deckMaterialMetal
				bumpMapURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/deckMaterialMetalBump		
				transformName = proceduralDeck
			}
		}
	}

	MODULE
	{
		name = WBIModulePartSubvariants
		moduleID = hullTexture
		updateSymmetry = true
		allowFieldUpdate = false

		VARIANT
		{
			name = lightHull
			displayName = #LOC_SUNKWORKS_lightHull // Light Hull
			primaryColor = #c7c7c7
			secondaryColor = #c7c7c7

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/hullPaint
				transformName = proceduralUpperHull
				transformName = proceduralRailings
			}
		}

		VARIANT
		{
			name = darkHull
			displayName = #LOC_SUNKWORKS_darkHull // Dark Hull
			primaryColor = #d3d3d3
			secondaryColor = #000000

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/hullPaintDark
				transformName = proceduralUpperHull
				transformName = proceduralRailings
			}
		}
	}

	MODULE
	{
		name = WBIModulePartSubvariants
		moduleID = antiFoulTexture
		updateSymmetry = true
		allowFieldUpdate = false

		VARIANT
		{
			name = antiFoulBlue
			displayName = #LOC_SUNKWORKS_antiFoulBlue // Anti Foul: Blue
			primaryColor = #476997
			secondaryColor = #476997

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/antiFoulPaint
				transformName = proceduralLowerHull
			}
		}

		VARIANT
		{
			name = antiFoulRed
			displayName = #LOC_SUNKWORKS_antiFoulRed // Anti Foul: Red
			primaryColor = #6f3131
			secondaryColor = #6f3131

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/antiFoulPaintRed
				transformName = proceduralLowerHull
			}
		}

		VARIANT
		{
			name = antiFoulBlack
			displayName = #LOC_SUNKWORKS_antiFoulBlack // Anti Foul: Black
			primaryColor = #222222
			secondaryColor = #222222

			TEXTURES
			{
				mainTextureURL = WildBlueIndustries/SunkWorks/Parts/Structural/ProceduralBoatHull/antiFoulPaintBlack
				transformName = proceduralLowerHull
			}
		}

	}

	MODULE
	{
		name = WBIBallastCalculator
		ballastPercent = 100
	}

	MODULE
	{
		name = WBIBallastTank
		ballastResourceName = IntakeLqd
		fullFillRate = 20
		fullVentRate = 10
	}

	MODULE
	{
		name = WBIHydrodynamicDragReducer
		hullLength = 60
		hullBeam = 15
		minimumSlendernessRatio = 1.5
		maximumSlendernessRatio = 6.0
		maximumDragReduction = 0.20
	}
}
